name: fitcalchub
description: FitCalcHub - free health and fitness calculators.
publish_to: "none"
version: 1.0.1+2
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fitcalchub-hero.svg

    - assets/article-calories.svg
    - assets/article-bmr.svg
    - assets/article-protein.svg
    - assets/article-bmi.svg