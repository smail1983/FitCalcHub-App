name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name fitcalchub .

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitcalchub-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FitCalcHub Android v1.0.${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
